name: Import Pixel 3 Android 17 kernel
on:
  push:
    paths:
      - '.github/workflows/import-lineage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the Android 17 Linux 4.9 source
        shell: bash
        run: |
          set -euo pipefail
          if test -f Makefile; then
            echo "Kernel is already imported; refusing to overwrite."
            exit 0
          fi
          git remote add source https://github.com/its-hecker/android_kernel_google_msm-4.9.git
          git fetch --no-tags --depth=1 source refs/heads/lineage-24.0
          git checkout FETCH_HEAD -- .
          git add -A
          git config user.name "Hecker"
          git config user.email "noreply@github.com"
          git commit -m "Import Android 17 Pixel 3 Linux 4.9 kernel source"
          git push origin HEAD:main
